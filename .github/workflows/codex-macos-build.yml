name: HGhub macOS build
run-name: HGhub 1.3.0 macOS arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CI: "true"
      RUSTUP_TOOLCHAIN: "1.95.0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: be605d539aacd1380e2a2e5f1e67035172b1941c
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: codex-macos-arm64-rust-1.95
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS app and DMG
        run: pnpm tauri build --config src-tauri/tauri.macos.conf.json --target aarch64-apple-darwin --bundles app,dmg
      - name: Verify and collect package
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/HghubX.app"
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "1.3.0"
          lipo -archs "$APP/Contents/MacOS/hghub" | grep -qx arm64
          mkdir -p artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg artifacts/HghubX_1.3.0_arm64.dmg
          (cd artifacts && shasum -a 256 *.dmg > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: hghub-macos-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
